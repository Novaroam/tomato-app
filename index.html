<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日系治癒番茄鐘</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --text-main: #4a4e4d;
      --text-muted: #8e9490;
      --accent-work: #e28774;
      --accent-break: #8cae97;
      --card-bg: rgba(255, 255, 255, 0.75);
    }
    * { 
      box-sizing: border-box; 
      transition: all 0.4s ease; 
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0; 
      padding: 20px;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      min-height: 100vh; 
      overflow: hidden;
    }
    .app-container {
      width: 100%; 
      max-width: 360px; 
      text-align: center; 
      padding: 40px 20px; 
      border-radius: 32px;
      background: var(--card-bg); 
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(142, 148, 144, 0.15); 
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .current-time { 
      font-size: 14px; 
      color: var(--text-muted); 
      letter-spacing: 2px; 
      margin-bottom: 25px; 
    }
    .status-badge { 
      font-size: 13px; 
      letter-spacing: 3px; 
      padding: 6px 20px; 
      border-radius: 50px; 
      color: white; 
      display: inline-block; 
      font-weight: 500; 
    }
    .bg-work { background-color: var(--accent-work); }
    .bg-break { background-color: var(--accent-break); }
    .timer-display { 
      font-size: 76px; 
      font-weight: 200; 
      margin: 30px 0; 
      font-variant-numeric: tabular-nums; 
      letter-spacing: -2px; 
    }
    .controls { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      margin-bottom: 35px; 
    }
    button { 
      border: 1px solid #dcd7cd; 
      background: white; 
      color: var(--text-main); 
      padding: 12px 30px; 
      border-radius: 50px; 
      font-size: 15px; 
      cursor: pointer; 
      letter-spacing: 1px; 
    }
    button:active { 
      transform: scale(0.97); 
      background: #faf8f5; 
    }
    .btn-main { 
      background: var(--text-main); 
      color: var(--bg-color); 
      border: none; 
    }
    .panel-info { 
      border-top: 1px solid #ebe6dc; 
      padding-top: 25px; 
      text-align: left; 
      font-size: 13px; 
      color: var(--text-main); 
      line-height: 1.8; 
    }
    .panel-info strong { color: var(--accent-break); }
    .time-setter { 
      margin-top: 15px; 
      display: flex; 
      justify-content: space-between; 
      font-size: 12px; 
      color: var(--text-muted); 
    }
    .time-setter input { 
      width: 45px; 
      border: none; 
      background: #ebe6dc; 
      border-radius: 6px; 
      text-align: center; 
      padding: 3px; 
      color: var(--text-main); 
      font-size: 12px; 
    }
    .modal-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(74, 78, 77, 0.4); 
      backdrop-filter: blur(8px); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
    }
    .modal { 
      background: #fbfbf9; 
      padding: 35px 25px; 
      border-radius: 28px; 
      width: 88%; 
      max-width: 320px; 
      text-align: center; 
      box-shadow: 0 15px 50px rgba(0,0,0,0.1); 
      border: 1px solid #fff; 
    }
    .modal h2 { 
      font-size: 20px; 
      font-weight: 500; 
      margin: 0 0 10px 0; 
      color: var(--text-main); 
    }
    .modal p { 
      font-size: 14px; 
      color: var(--text-muted); 
      margin-bottom: 30px; 
      line-height: 1.5; 
    }
    .modal-btn { 
      width: 100%; 
      margin: 10px 0; 
      padding: 15px; 
      border-radius: 50px; 
      font-size: 15px; 
      font-weight: bold; 
    }
    .btn-consume { 
      background-color: var(--accent-break); 
      color: white; 
      border: none; 
      font-size: 15px; 
      box-shadow: 0 6px 15px rgba(140,174,151,0.4); 
    }
    .btn-watch-ad { 
      background-color: transparent; 
      color: var(--text-muted); 
      border: 1px solid #dcd7cd; 
    }
    .auto-checkbox { 
      margin-top: 20px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      font-size: 12px; 
      color: var(--text-muted); 
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="current-time" id="currentTime">00:00:00</div>
    <div class="status-badge bg-work" id="statusTag">工作專注中</div>
    <div class="timer-display" id="timerDisplay">25:00</div>

    <div class="controls">
      <button class="btn-main" id="startBtn" onclick="toggleTimer()">開始</button>
      <button onclick="resetTimer()">重設</button>
    </div>

    <div class="panel-info">
      <div>⚡ 專注能量：<strong id="pointsText">0</strong> 點 (今日上限 10 點)</div>
      <div>🍵 已完輪數：<strong id="roundsText">0</strong> / 3 輪</div>

      <div class="time-setter">
        <label>專注 (分) <input type="number" id="workInput" value="25" onchange="updateSettings()"></label>
        <label>休息 (分) <input type="number" id="breakInput" value="5" onchange="updateSettings()"></label>
      </div>
    </div>
  </div>

  <!-- 彈出 Modal 視窗 -->
  <div class="modal-overlay" id="adModal">
    <div class="modal">
      <h2>恭喜完成一輪專注！🎉</h2>
      <p>您目前擁有 <span id="modalPoints">0</span> 點專注能量。</p>
      <button class="modal-btn btn-consume" onclick="usePointChoice()">⚡ 消耗 1 點：跳過廣告直接休息</button>
      <button class="modal-btn btn-watch-ad" onclick="watchAdChoice()">🎬 看個廣告：省下點數留到下次</button>
      <div class="auto-checkbox">
        <input type="checkbox" id="autoDeductCheck" onchange="toggleAutoDeduct()">
        <label for="autoDeductCheck">之後有點數時，請自動幫我扣點跳過廣告</label>
      </div>
    </div>
  </div>

  <script>
    const ADMOB_REWARD_ID = 'ca-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX';
    let timer, timeLeft, isRunning = false, currentMode = 'work';
    let workMinutes = 25, breakMinutes = 5;
    let points = parseInt(localStorage.getItem('jp_pts')) || 0;
    let rounds = parseInt(localStorage.getItem('jp_rds')) || 0;
    let autoDeduct = localStorage.getItem('jp_auto') === 'true';
    let todayStr = new Date().toDateString();
    let dailyEarned = localStorage.getItem('jp_date') === todayStr ? parseInt(localStorage.getItem('jp_earned')) || 0 : 0;

    document.addEventListener("deviceready", onDeviceReady, false);

    function onDeviceReady() {
      if (window.admob && window.admob.rewarded) {
        admob.rewarded.config({ id: ADMOB_REWARD_ID });
        admob.rewarded.prepare();
      }
    }

    window.onload = function() {
      document.getElementById('autoDeductCheck').checked = autoDeduct;
      setInterval(showCurrentTime, 1000);
      showCurrentTime(); 
      updateStatsUI(); 
      resetTimer();
    }

    function showCurrentTime() {
      let now = new Date();
      document.getElementById('currentTime').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
    }

    function updateSettings() {
      workMinutes = parseInt(document.getElementById('workInput').value) || 25;
      breakMinutes = parseInt(document.getElementById('breakInput').value) || 5;
      if (!isRunning) resetTimer();
    }

    function resetTimer() {
      clearInterval(timer); 
      isRunning = false;
      document.getElementById('startBtn').innerText = '開始';
      timeLeft = (currentMode === 'work') ? workMinutes * 60 : breakMinutes * 60;
      displayTime();
    }

    function toggleTimer() {
      if (isRunning) { 
        clearInterval(timer); 
        document.getElementById('startBtn').innerText = '開始'; 
      } else { 
        timer = setInterval(tick, 1000); 
        document.getElementById('startBtn').innerText = '暫停'; 
      }
      isRunning = !isRunning;
    }

    function tick() {
      if (timeLeft > 0) { 
        timeLeft--; 
        displayTime(); 
      } else { 
        clearInterval(timer); 
        isRunning = false; 
        document.getElementById('startBtn').innerText = '開始'; 
        handleRoundComplete(); 
      }
    }

    function displayTime() {
      let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      let s = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    function handleRoundComplete() {
      if (currentMode === 'work') {
        rounds++; 
        localStorage.setItem('jp_rds', rounds); 
        updateStatsUI();
        if (rounds % 3 === 0) {
          if (autoDeduct && points > 0) {
            points--; 
            savePointsData();
            alert('已自動扣除 1 點能量，直接休息。'); 
            startBreakMode();
          } else { 
            showAdModal(); 
          }
        } else { 
          startBreakMode(); 
        }
      } else {
        currentMode = 'work';
        document.getElementById('statusTag').innerText = '工作專注中';
        document.getElementById('statusTag').className = 'status-badge bg-work';
        resetTimer();
      }
    }

    function showAdModal() { 
      document.getElementById('modalPoints').innerText = points; 
      document.getElementById('adModal').style.display = 'flex'; 
    }

    function usePointChoice() {
      if (points > 0) { 
        points--; 
        savePointsData(); 
        closeModal(); 
        startBreakMode(); 
      } else { 
        alert('能量點數不足，觀看廣告可以累積點數喔。'); 
      }
    }

    function watchAdChoice() {
      closeModal();
      if (window.admob && window.admob.rewarded) {
        admob.rewarded.show().then(() => { 
          giveRewardPoints(); 
          admob.rewarded.prepare(); 
        }).catch((err) => { 
          alert('廣告載入慢了些，先為您進入休息時光。'); 
          startBreakMode(); 
        });
      } else {
        alert('模擬提示：正在為您載入 30 秒治癒廣告影片...');
        setTimeout(() => { giveRewardPoints(); }, 2000);
      }
    }

    function giveRewardPoints() {
      let checkDate = new Date().toDateString();
      if (localStorage.getItem('jp_date') !== checkDate) { 
        dailyEarned = 0; 
        localStorage.setItem('jp_date', checkDate); 
      }
      if (dailyEarned < 10) {
        points++; 
        dailyEarned++; 
        localStorage.setItem('jp_earned', dailyEarned); 
        savePointsData();
        alert(`🎉 獲得 1 點能量！（今日已儲存 ${dailyEarned}/10 點）`);
      } else { 
        alert('今日能量已達上限，本次雖不發放點數，但依舊可以直接休息。'); 
      }
      startBreakMode();
    }

    function startBreakMode() {
      currentMode = 'break'; 
      document.getElementById('statusTag').innerText = '放鬆休息中';
      document.getElementById('statusTag').className = 'status-badge bg-break'; 
      resetTimer(); 
      toggleTimer();
    }

    function closeModal() { document.getElementById('adModal').style.display = 'none'; }
    function toggleAutoDeduct() { autoDeduct = document.getElementById('autoDeductCheck').checked; localStorage.setItem('jp_auto', autoDeduct); }
    function savePointsData() { localStorage.setItem('jp_pts', points); updateStatsUI(); }
    function updateStatsUI() { document.getElementById('pointsText').innerText = points; document.getElementById('roundsText').innerText = rounds; }
  </script>
</body>
</html>
